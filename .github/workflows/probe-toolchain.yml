name: probe-toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 测试匿名拉取高通工具链镜像
        continue-on-error: true
        run: |
          docker --version
          echo "=== 尝试匿名 pull v0.7 ==="
          timeout 1500 docker pull ghcr.io/snapdragon-toolchain/arm64-android:v0.7 2>&1 | tail -30
          echo "PULL_EXIT=${PIPESTATUS[0]}"

      - name: 探测 registry 是否需要认证
        run: |
          echo "=== 匿名 token 请求 ==="
          curl -s -w "\nHTTP=%{http_code}\n" \
            "https://ghcr.io/token?scope=repository%3Asnapdragon-toolchain%2Farm64-android%3Apull&service=ghcr.io" \
            | head -c 600
          echo
          echo "=== 备用 tag 探测 (v0.6) ==="
          timeout 600 docker pull ghcr.io/snapdragon-toolchain/arm64-android:v0.6 2>&1 | tail -10 || true
